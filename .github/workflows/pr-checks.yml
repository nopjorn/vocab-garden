name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ตรวจเลข version และ CHANGELOG
        run: python3 scripts/versioning.py check --base-ref "origin/${GITHUB_BASE_REF}"

      - name: ตรวจเงื่อนไข NGSL
        run: python3 scripts/check_ngsl.py

      - name: ตรวจรูปแบบชุดข้อมูลคำศัพท์
        run: python3 scripts/validate_data.py

      - name: Unit tests (Python)
        run: python3 -m unittest discover -s tests -v

      - name: Unit tests (JavaScript)
        run: node --test tests/js/*.test.mjs
