name: Release

on:
  push:
    branches: [main]
  # สั่งรันเองได้จากหน้า Actions (หรือ API) เมื่อ deploy ขึ้น Pages ไม่สำเร็จเพราะ GitHub ขัดข้องชั่วคราว
  # (การ re-run run เดิมทำไม่ได้ เพราะจะอัปโหลด artifact ซ้ำชื่อ github-pages) ขั้นสร้าง Release จะข้ามเองถ้ามีอยู่แล้ว
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: สร้าง tag และ GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: อ่านเลข version และ release notes จาก CHANGELOG
        id: info
        run: |
          version="$(python3 scripts/versioning.py current)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          python3 scripts/versioning.py notes "${version}" > "${RUNNER_TEMP}/notes.md"

      - name: สร้าง tag และ Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.info.outputs.version }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::warning::มี Release ${TAG} อยู่แล้ว ข้ามขั้นตอนนี้"
            exit 0
          fi
          gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"

  deploy:
    name: Deploy ขึ้น GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      # หน้า "มีอะไรใหม่" ในแอปอ่านจากไฟล์นี้ (ไม่ได้เก็บซ้ำใน repo)
      - name: คัดลอก CHANGELOG ไปไว้กับแอป
        run: cp CHANGELOG.md app/changelog.md

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v5
